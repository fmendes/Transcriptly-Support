name: Get help with Transcriptly
description: Report a problem or request help with the Transcriptly macOS app.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Transcriptly.

        **Do not post recordings, transcript text, API keys, passwords, or other private information.** This issue will be public.
  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - Recording or permissions
        - Transcription or language availability
        - Apple Intelligence or AI provider
        - Summary or concept diagram
        - Storage, export, or playback
        - Something else
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Transcriptly version
      description: Find this in Transcriptly’s About window.
      placeholder: e.g. 1.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us what you did, without including recording or transcript content.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message if there was one. Remove anything sensitive first.
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI provider, if relevant
      options:
        - Not relevant
        - Apple Intelligence (on-device)
        - Claude API
        - Local OpenAI-compatible server
        - Cloud OpenAI-compatible endpoint
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included recordings, transcripts, API keys, passwords, or other sensitive information.
          required: true
